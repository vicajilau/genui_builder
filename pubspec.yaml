name: genui_playground_workspace
description: Playground for Generative UI with Flutter, genui and A2UI.
publish_to: none

environment:
  sdk: ^3.12.0 

workspace:
  - app
  - genui_server
  - genui_client

dev_dependencies:
  melos: ^7.8.0

melos:
  scripts:
    build_runner:
      run: melos exec -c 1 --depends-on="build_runner" -- "dart run build_runner build" && dart format app/lib && (cd app && flutter test test/catalog_json_test.dart)
      description: Run build_runner in all required packages.
    analyze:
      run: melos exec -- "dart analyze . --fatal-infos"
      description: Run dart analyzer across the monorepo.
    format:
      run: melos exec -- "dart format --set-exit-if-changed ."
      description: Check Dart formatting across the monorepo.
    test:
      run: melos exec --dir-exists="test" --ignore="genui_server" -- "flutter test"
      description: Run Flutter tests in packages that contain a test directory.